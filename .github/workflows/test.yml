name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this job builds nothing and publishes nothing.
permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest

    # Everything lives in backend/; the repo root holds no package.json.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # 20 is the version the README asks for, so that is the one worth
      # proving. Developing on something newer is fine; shipping a floor
      # nobody tests is not.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if the two
      # have drifted, which is the whole point of running this somewhere other
      # than the machine that wrote them.
      - run: npm ci

      # The suites cover the scoring and gap rules — pure functions over plain
      # objects, so no database, no keys, no services need to be up.
      - run: npm test

  # Its own job rather than more steps on the one above: the two share no
  # files and no lockfile, so running them side by side is both faster and
  # clearer about which half broke.
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite, oxlint and the React plugin all want ^20.19.0 || >=22.12.0, so
      # this has to resolve to a recent 20.x — which `20` does, since
      # setup-node installs the newest patch for a major.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # The point of the job. Vercel builds on push too, but a failure there
      # is found after the fact and in someone else's logs; this fails on the
      # commit that caused it. No env needed — VITE_API_URL is optional and
      # defaults to the relative /api.
      - run: npm run build
